<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presídio Salvador - Lista de Visitas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #666;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #555;
        }

        .table-section {
            margin-top: 30px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .table-title {
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }

        .counter {
            background-color: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #333;
            color: white;
            padding: 10px;
            text-align: left;
            font-size: 13px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f0f0f0;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            width: auto;
            margin: 0;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
            z-index: 1000;
        }

        .notification.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .notification.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PRESÍDIO SALVADOR</h1>
        <p class="subtitle">Lista de Visitas</p>
        
        <div class="form-group">
            <label for="nome">Nome do Visitante:</label>
            <input type="text" id="nome" placeholder="Digite o nome completo">
        </div>
        
        <button onclick="adicionarPessoa()">Adicionar à Lista</button>

        <div class="table-section">
            <div class="table-header">
                <span class="table-title">Lista de Espera</span>
                <span class="counter" id="counter">0 pessoas</span>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Nome</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="tabelaFila">
                    <!-- Dados serão inseridos aqui -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // SEU LINK DA API
        const API_URL = 'https://script.google.com/macros/s/AKfycbz1ruTjJZaCemdffTDHFbdaXvHL8bcYRO7atByQkwUWNwWlN--hq-rSuIrJPb7iUDwC/exec';

        function mostrarNotificacao(mensagem, tipo) {
            const notification = document.getElementById('notification');
            notification.textContent = mensagem;
            notification.className = `notification ${tipo}`;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        async function adicionarPessoa() {
            const nome = document.getElementById('nome').value.trim();

            if (!nome) {
                mostrarNotificacao('Por favor, digite o nome!', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}?action=adicionar&nome=${encodeURIComponent(nome)}`);
                const data = await response.json();
                
                if (data.success) {
                    mostrarNotificacao(data.message, 'success');
                    document.getElementById('nome').value = '';
                    carregarFila();
                } else {
                    mostrarNotificacao(data.message, 'error');
                    document.getElementById('nome').value = '';
                }
            } catch (error) {
                mostrarNotificacao('Erro ao conectar com o servidor!', 'error');
            }
        }

        async function removerPessoa(nome) {
            if (confirm('Remover ' + nome + ' da lista?')) {
                try {
                    const response = await fetch(`${API_URL}?action=remover&nome=${encodeURIComponent(nome)}`);
                    const data = await response.json();
                    
                    if (data.success) {
                        mostrarNotificacao(data.message, 'success');
                        carregarFila();
                    } else {
                        mostrarNotificacao(data.message, 'error');
                    }
                } catch (error) {
                    mostrarNotificacao('Erro ao conectar com o servidor!', 'error');
                }
            }
        }

        async function carregarFila() {
            try {
                const response = await fetch(`${API_URL}?action=listar`);
                const data = await response.json();
                
                if (data.success) {
                    atualizarTabela(data.fila);
                }
            } catch (error) {
                mostrarNotificacao('Erro ao carregar lista!', 'error');
            }
        }

        function atualizarTabela(fila) {
            const tbody = document.getElementById('tabelaFila');
            tbody.innerHTML = '';

            fila.forEach((pessoa, index) => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${index + 1}º</td>
                    <td>${pessoa.nome}</td>
                    <td>
                        <button class="delete-btn" onclick="removerPessoa('${pessoa.nome}')">Remover</button>
                    </td>
                `;
            });

            document.getElementById('counter').textContent = 
                fila.length + (fila.length === 1 ? ' pessoa' : ' pessoas');
        }

        document.getElementById('nome').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                adicionarPessoa();
            }
        });

        // Carregar fila ao abrir
        carregarFila();
    </script>
</body>
</html>
